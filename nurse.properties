# ナーススケジューリング CSP エンジンの設定（Java 形式の properties。書式は nurse/config.py）。
# 単位は秒。ここを書き換えると、次の solve() / diagnose() の呼び出しから反映される（コードの変更は不要）。
# 関数の引数（time_limit / mus_time_limit）や CLI のオプションで渡した値は、この設定より優先する。

# 求解（CP-SAT）の時間制限。超えると「求解が時間切れ」（リターンコード 10）
solve.time_limit = 30

# MUS（矛盾の原因の絞り込み）1回あたりの時間制限。soft の MUS と前提の MUS にそれぞれ適用する。
# 超えると、事前候補（最小とは限らない矛盾の集合）を返す（リターンコード 21）
mus.time_limit = 30
