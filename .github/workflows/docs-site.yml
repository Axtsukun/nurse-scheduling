name: Docs site

# サイトのビルド検証と成果物の保存だけを行う。GitHub Pages へは公開しない（private リポジトリの Pages はインターネットに公開されるため）。
on:
  pull_request:
    branches: [develop, main]
    paths: ['README.md', 'docs/**', 'mkdocs.yml', 'tools/mkdocs_hooks.py', 'requirements-docs.txt', '.github/workflows/docs-site.yml']
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: NO_MKDOCS_2_WARNING=1 mkdocs build --strict
      # リポジトリに読み取り権限のある人だけが Actions の画面から取得できる（公開されない）
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 30
