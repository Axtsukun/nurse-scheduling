<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勤務表エンジン サンプル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>勤務表エンジン サンプル</h1>
  <nav id="tabs">
    <button data-tab="data" class="on">① データ編集</button>
    <button data-tab="params">② 制約・パラメータ</button>
    <button data-tab="run">③ 実行と結果</button>
  </nav>
  <div class="spacer"></div>
  <span id="dirty" class="muted"></span>
  <button id="reset" title="入力 CSV を見本データで作り直す">見本データに戻す</button>
  <button id="save">保存</button>
  <button id="runbtn" class="primary">エンジンを実行</button>
</header>
<main>
  <section id="tab-data">
    <nav id="subtabs" class="subtabs"></nav>
    <p id="datahelp" class="muted"></p>
    <div id="datatable"></div>
  </section>
  <section id="tab-params" hidden>
    <h2>パラメータ</h2>
    <div id="params"></div>
    <h2>外せる制約（層2・層3）</h2>
    <p class="muted">チェックを外した制約は、求解に使いません。層1（労働法規）とカーネルは外せません。</p>
    <div id="constraints"></div>
  </section>
  <section id="tab-run" hidden>
    <div class="cols">
      <aside>
        <h2>実行履歴</h2>
        <p class="muted">実行ごとに入力と結果を保管します。いつでも選び直して見られます。</p>
        <div id="history"></div>
      </aside>
      <div class="result">
        <div id="result"><p class="muted">「エンジンを実行」を押すと、ここに結果が出ます。</p></div>
      </div>
    </div>
  </section>
</main>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
